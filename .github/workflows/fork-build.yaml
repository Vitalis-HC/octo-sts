name: Fork image
on:
  pull_request:
  push:
    branches: [vitalis/main]
permissions: {}
jobs:
  build:
    if: github.repository == 'Vitalis-HC/octo-sts'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-pinned Go and ko
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLo go.tgz https://go.dev/dl/go1.27.3.linux-amd64.tar.gz
          echo '65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40  go.tgz' | sha256sum -c -
          tar -xzf go.tgz
          curl -fsSLo ko.tgz https://github.com/ko-build/ko/releases/download/v0.19.1/ko_0.19.1_Linux_x86_64.tar.gz
          echo '635ac6ea3fd376c935fee597fbb29ab2c2449f49ef1655085fe3aa9c25fed7a5  ko.tgz' | sha256sum -c -
          mkdir ko-bin
          tar -xzf ko.tgz -C ko-bin ko
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/ko-bin" >> "$GITHUB_PATH"
      - name: Download checksum-verified Go modules
        run: go mod download
      - name: Test affected packages without external test traffic
        env:
          GOPROXY: 'off'
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost,::1
        run: go test -race ./pkg/octosts ./pkg/envconfig ./cmd/app
      - name: Build twice and compare immutable OCI digests
        run: .github/scripts/build-fork.sh "$RUNNER_TEMP/fork-image"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: fork-image
          path: ${{ runner.temp }}/fork-image/image.tar
          if-no-files-found: error
  attest:
    needs: build
    if: github.event_name == 'push' && github.repository == 'Vitalis-HC/octo-sts' && github.ref == 'refs/heads/vitalis/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: image
          merge-multiple: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2; repository policy must allow actions/attest@*
        with:
          subject-path: image/image.tar
  promote:
    needs: [build, attest]
    # Runs once the octo_sts_release_variables output from quality's infra/agent-broker is set as Actions variables.
    if: vars.GCP_WIF_PROVIDER != '' && github.event_name == 'push' && github.repository == 'Vitalis-HC/octo-sts' && github.ref == 'refs/heads/vitalis/main'
    runs-on: ubuntu-24.04
    permissions:
      attestations: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: image
          merge-multiple: true
      - name: Verify the attestation and push to agent-tools by digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          PROMOTER_SA: ${{ vars.GCP_PROMOTER_SA }}
          AGENT_TOOLS_REPO: ${{ vars.AGENT_TOOLS_REPO }}
        run: |
          set -euo pipefail
          [[ $WIF_PROVIDER =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/octo-sts-release/providers/github$ ]]
          [[ $PROMOTER_SA =~ ^octo-sts-promoter@[a-z][a-z0-9-]+\.iam\.gserviceaccount\.com$ ]]
          [[ $AGENT_TOOLS_REPO =~ ^[a-z0-9-]+-docker\.pkg\.dev/[a-z][a-z0-9-]+/agent-tools$ ]]
          gh attestation verify image/image.tar --repo "$GITHUB_REPOSITORY" \
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/fork-build.yaml" --deny-self-hosted-runners
          mkdir oci && tar -xf image/image.tar -C oci
          [[ $(jq -r .commit oci/provenance.json) == "$GITHUB_SHA" ]]
          digest=$(jq -r .image_digest oci/provenance.json)
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ $(jq -c '[.manifests[].digest]' oci/image/index.json) == "[\"$digest\"]" ]]

          cd "$RUNNER_TEMP"
          curl -fsSLo crane.tgz https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz
          echo '0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0  crane.tgz' | sha256sum -c -
          tar -xzf crane.tgz crane
          cd "$GITHUB_WORKSPACE"

          # GitHub OIDC token -> Google federated token -> 10-minute promoter token. Nothing is written to disk but the registry login.
          oidc=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" -G "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            --data-urlencode "audience=https://iam.googleapis.com/$WIF_PROVIDER" | jq -r .value)
          echo "::add-mask::$oidc"
          federated=$(curl -fsS https://sts.googleapis.com/v1/token \
            --data-urlencode "audience=//iam.googleapis.com/$WIF_PROVIDER" \
            --data-urlencode grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
            --data-urlencode requested_token_type=urn:ietf:params:oauth:token-type:access_token \
            --data-urlencode scope=https://www.googleapis.com/auth/cloud-platform \
            --data-urlencode subject_token_type=urn:ietf:params:oauth:token-type:jwt \
            --data-urlencode "subject_token=$oidc" | jq -r .access_token)
          echo "::add-mask::$federated"
          token=$(curl -fsS -H "Authorization: Bearer $federated" -H 'Content-Type: application/json' \
            -d '{"scope":["https://www.googleapis.com/auth/cloud-platform"],"lifetime":"600s"}' \
            "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/$PROMOTER_SA:generateAccessToken" | jq -r .accessToken)
          echo "::add-mask::$token"
          export DOCKER_CONFIG="$RUNNER_TEMP/registry-login"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf %s "$token" | "$RUNNER_TEMP/crane" auth login "${AGENT_TOOLS_REPO%%/*}" -u oauth2accesstoken --password-stdin

          # Tags are immutable: a rerun finds its own commit's tag already pointing at this digest.
          ref="$AGENT_TOOLS_REPO/octo-sts:$GITHUB_SHA"
          if existing=$("$RUNNER_TEMP/crane" digest "$ref" 2>/dev/null); then
            [[ $existing == "$digest" ]]
          else
            "$RUNNER_TEMP/crane" push oci/image "$ref"
          fi
          [[ $("$RUNNER_TEMP/crane" digest "$ref") == "$digest" ]]
          echo "Promoted \`$AGENT_TOOLS_REPO/octo-sts@$digest\` from $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
